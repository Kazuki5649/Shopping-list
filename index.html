<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#d71920">

    <meta
        name="description"
        content="山岸家で共有する買い物メモ"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="山岸家買い物"
    >

    ./manifest.json

    ./icon-192.png

    ./icon-192.png

    <title>山岸家 買い物メモ</title>

    <style>
　　　　　 :root {
　　　　　　 --main-red: #4aa3df;
　　　　　　 --dark-red: #2e85c0;
　　　　　　 --light-red: #e8f5ff;
            --background: #f5f5f5;
            --card: #ffffff;
            --text: #333333;
            --sub-text: #777777;
            --border: #dddddd;
            --delete: #666666;
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background-color: var(--background);
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding:
                env(safe-area-inset-top)
                14px
                env(safe-area-inset-bottom);
            background-color: var(--background);
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                sans-serif;
        }

        .header {
            margin: 0 -14px 18px;
            padding: 18px 14px;
            background-color: var(--main-red);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #ffffff;
            font-size: 25px;
        }

        h1 {
            margin: 0;
            font-size: 25px;
            line-height: 1.3;
        }

        .subtitle {
            margin: 5px 0 0;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-size: 13px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
        }

        .input-card {
            margin-bottom: 18px;
            padding: 16px;
            border-top: 4px solid var(--main-red);
            border-radius: 12px;
            background-color: var(--card);
            box-shadow: 0 2px 9px rgba(0, 0, 0, 0.09);
        }

        .input-title {
            margin: 0 0 12px;
            font-size: 16px;
            font-weight: 700;
        }

        .input-area {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 110px 120px auto;
            gap: 8px;
        }

        input[type="text"],
        select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--text);
            font-size: 16px;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--main-red);
            outline: 3px solid rgba(215, 25, 32, 0.14);
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            touch-action: manipulation;
        }

        .add-btn {
            min-height: 46px;
            padding: 12px 19px;
            background-color: var(--main-red);
            color: #ffffff;
            font-weight: 700;
        }

        .add-btn:active {
            background-color: var(--dark-red);
            transform: scale(0.98);
        }

        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 5px 2px 10px;
        }

        .list-title {
            margin: 0;
            font-size: 18px;
        }

        .item-count {
            padding: 4px 9px;
            border-radius: 14px;
            background-color: var(--light-red);
            color: var(--main-red);
            font-size: 13px;
            font-weight: 700;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 14px;
            border-left: 5px solid var(--main-red);
            border-radius: 10px;
            background-color: var(--card);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.09);
        }

        li.completed {
            border-left-color: #bbbbbb;
            background-color: #eeeeee;
        }

        .check-box {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            accent-color: var(--main-red);
        }

        .item-information {
            min-width: 0;
            flex: 1;
        }

        .item-name-line {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-name {
            overflow-wrap: anywhere;
            font-size: 17px;
            font-weight: 700;
        }

        .item-quantity {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 12px;
            background-color: var(--light-red);
            color: var(--main-red);
            font-size: 14px;
            font-weight: 700;
        }

        .item-details {
            margin-top: 5px;
            color: var(--sub-text);
            font-size: 13px;
            line-height: 1.5;
        }

        .completed .item-name {
            color: #999999;
            text-decoration: line-through;
        }

        .completed .item-quantity {
            background-color: #dddddd;
            color: #888888;
        }

        .completed .item-details {
            color: #aaaaaa;
        }

        .delete-btn {
            flex-shrink: 0;
            padding: 9px 11px;
            background-color: var(--delete);
            color: #ffffff;
            font-size: 14px;
        }

        .delete-btn:active {
            background-color: #333333;
        }

        .empty-message {
            margin-top: 25px;
            padding: 28px 14px;
            border: 2px dashed #cccccc;
            border-radius: 12px;
            background-color: #fafafa;
            color: var(--sub-text);
            text-align: center;
        }

        .empty-icon {
            display: block;
            margin-bottom: 7px;
            font-size: 36px;
        }

        .footer {
            margin-top: 28px;
            padding-bottom: 12px;
            color: #999999;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 620px) {
            .input-area {
                grid-template-columns: minmax(0, 1fr) 105px;
            }

            #userInput {
                grid-column: 1;
            }

            .add-btn {
                grid-column: 2;
                width: 100%;
            }
        }

        @media (max-width: 390px) {
            h1 {
                font-size: 21px;
            }

            .header-icon {
                width: 39px;
                height: 39px;
                font-size: 22px;
            }

            .input-area {
                grid-template-columns: 1fr;
            }

            #userInput,
            .add-btn {
                grid-column: 1;
            }

            li {
                gap: 9px;
                padding: 12px 10px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="header-icon">🐶</div>

            <div>
                <h1>山岸家 買い物メモ</h1>
                <p class="subtitle">
                    家族みんなの買い物リスト
                </p>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="input-card">
            <p class="input-title">
                🛒 買うものを追加
            </p>

            <div class="input-area">
                <input
                    type="text"
                    id="itemInput"
                    placeholder="買うもの"
                    maxlength="50"
                    autocomplete="off"
                >

                <input
                    type="text"
                    id="quantityInput"
                    placeholder="必要数"
                    maxlength="15"
                    autocomplete="off"
                >

                <select
                    id="userInput"
                    aria-label="登録者"
                >
                    <option value="一樹">一樹</option>
                    <option value="和佳">和佳</option>
                    <option value="陽多希">陽多希</option>
                    <option value="旺佑">旺佑</option>
                </select>

                <button
                    type="button"
                    class="add-btn"
                    id="addButton"
                >
                    追加
                </button>
            </div>
        </section>

        <div class="list-header">
            <h2 class="list-title">
                買い物リスト
            </h2>

            <span
                id="itemCount"
                class="item-count"
            >
                0件
            </span>
        </div>

        <ul id="shoppingList"></ul>

        <div
            id="emptyMessage"
            class="empty-message"
        >
            <span class="empty-icon">🐾</span>
            買うものはまだ登録されていません
        </div>

        <footer class="footer">
            山岸家 買い物メモ
        </footer>
    </main>

    <script>
        const storageKey = "shoppingList";

        let items = loadItems();

        function loadItems() {
            try {
                const savedItems =
                    localStorage.getItem(storageKey);

                return savedItems
                    ? JSON.parse(savedItems)
                    : [];
            } catch (error) {
                console.error(
                    "保存データの読み込みに失敗しました",
                    error
                );

                return [];
            }
        }

        function saveItems() {
            localStorage.setItem(
                storageKey,
                JSON.stringify(items)
            );
        }

        function getToday() {
            const today = new Date();

            const year = today.getFullYear();

            const month = String(
                today.getMonth() + 1
            ).padStart(2, "0");

            const day = String(
                today.getDate()
            ).padStart(2, "0");

            return year + "/" + month + "/" + day;
        }

        function renderList() {
            const list =
                document.getElementById("shoppingList");

            const emptyMessage =
                document.getElementById("emptyMessage");

            const itemCount =
                document.getElementById("itemCount");

            list.innerHTML = "";

            const uncompletedCount =
                items.filter(function (item) {
                    return !item.checked;
                }).length;

            itemCount.textContent =
                uncompletedCount + "件";

            emptyMessage.style.display =
                items.length === 0
                    ? "block"
                    : "none";

            const sortedItems =
                items
                    .map(function (item, originalIndex) {
                        return {
                            item: item,
                            originalIndex: originalIndex
                        };
                    })
                    .sort(function (a, b) {
                        return (
                            Number(a.item.checked) -
                            Number(b.item.checked)
                        );
                    });

            sortedItems.forEach(function (entry) {
                const item = entry.item;
                const index = entry.originalIndex;

                const listItem =
                    document.createElement("li");

                if (item.checked) {
                    listItem.classList.add("completed");
                }

                const checkBox =
                    document.createElement("input");

                checkBox.type = "checkbox";
                checkBox.className = "check-box";
                checkBox.checked = Boolean(item.checked);

                checkBox.setAttribute(
                    "aria-label",
                    item.name + "を購入済みにする"
                );

                checkBox.addEventListener(
                    "change",
                    function () {
                        toggleItem(index);
                    }
                );

                const itemInformation =
                    document.createElement("div");

                itemInformation.className =
                    "item-information";

                const itemNameLine =
                    document.createElement("div");

                itemNameLine.className =
                    "item-name-line";

                const itemName =
                    document.createElement("div");

                itemName.className = "item-name";
                itemName.textContent = item.name;

                itemNameLine.appendChild(itemName);

                if (item.quantity) {
                    const itemQuantity =
                        document.createElement("span");

                    itemQuantity.className =
                        "item-quantity";

                    itemQuantity.textContent =
                        "必要数：" + item.quantity;

                    itemNameLine.appendChild(
                        itemQuantity
                    );
                }

                const itemDetails =
                    document.createElement("div");

                itemDetails.className =
                    "item-details";

                const userName =
                    item.user || "未入力";

                const inputDate =
                    item.createdDate || "記録なし";

                itemDetails.textContent =
                    "登録者：" + userName +
                    "　入力日：" + inputDate;

                const deleteButton =
                    document.createElement("button");

                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "削除";

                deleteButton.addEventListener(
                    "click",
                    function () {
                        deleteItem(index);
                    }
                );

                itemInformation.appendChild(
                    itemNameLine
                );

                itemInformation.appendChild(
                    itemDetails
                );

                listItem.appendChild(checkBox);
                listItem.appendChild(itemInformation);
                listItem.appendChild(deleteButton);

                list.appendChild(listItem);
            });
        }

        function addItem() {
            const itemInput =
                document.getElementById("itemInput");

            const quantityInput =
                document.getElementById(
                    "quantityInput"
                );

            const userInput =
                document.getElementById("userInput");

            const name =
                itemInput.value.trim();

            const quantity =
                quantityInput.value.trim();

            const user =
                userInput.value;

            if (name === "") {
                alert("買うものを入力してください");
                itemInput.focus();
                return;
            }

            items.push({
                name: name,
                quantity: quantity,
                user: user,
                createdDate: getToday(),
                checked: false
            });

            saveItems();
            renderList();

            itemInput.value = "";
            quantityInput.value = "";

            itemInput.focus();
        }

        function toggleItem(index) {
            items[index].checked =
                !items[index].checked;

            saveItems();
            renderList();
        }

        function deleteItem(index) {
            const itemName =
                items[index].name;

            const shouldDelete =
                confirm(
                    "「" + itemName +
                    "」を削除しますか？"
                );

            if (!shouldDelete) {
                return;
            }

            items.splice(index, 1);

            saveItems();
            renderList();
        }

        document
            .getElementById("addButton")
            .addEventListener("click", addItem);

        document
            .getElementById("itemInput")
            .addEventListener(
                "keydown",
                function (event) {
                    if (event.key === "Enter") {
                        addItem();
                    }
                }
            );

        document
            .getElementById("quantityInput")
            .addEventListener(
                "keydown",
                function (event) {
                    if (event.key === "Enter") {
                        addItem();
                    }
                }
            );

        if ("serviceWorker" in navigator) {
            window.addEventListener(
                "load",
                function () {
                    navigator.serviceWorker
                        .register("./service-worker.js")
                        .catch(function (error) {
                            console.error(
                                "PWAの登録に失敗しました",
                                error
                            );
                        });
                }
            );
        }

        renderList();
    </script>
</body>
</html>
