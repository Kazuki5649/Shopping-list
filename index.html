<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>家族の買い物リスト</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            margin: 10px 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .input-area {
            display: grid;
            grid-template-columns: 1fr 140px auto;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="text"],
        select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #ffffff;
            color: #333333;
            font-size: 16px;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #007aff;
            outline: 2px solid rgba(0, 122, 255, 0.2);
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-btn {
            padding: 12px 18px;
            background-color: #007aff;
            color: #ffffff;
            font-weight: bold;
        }

        .add-btn:active {
            background-color: #005fc4;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 14px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .check-box {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .item-information {
            min-width: 0;
            flex: 1;
        }

        .item-name {
            overflow-wrap: anywhere;
            font-size: 17px;
            font-weight: 500;
        }

        .item-details {
            margin-top: 4px;
            color: #777777;
            font-size: 13px;
            line-height: 1.5;
        }

        .completed .item-name {
            color: #999999;
            text-decoration: line-through;
        }

        .completed .item-details {
            color: #aaaaaa;
        }

        .delete-btn {
            flex-shrink: 0;
            padding: 9px 12px;
            background-color: #ff3b30;
            color: #ffffff;
            font-size: 14px;
        }

        .empty-message {
            margin-top: 30px;
            color: #777777;
            text-align: center;
        }

        @media (max-width: 520px) {
            body {
                padding: 14px;
            }

            h1 {
                font-size: 24px;
            }

            .input-area {
                grid-template-columns: 1fr 110px;
            }

            .add-btn {
                grid-column: 1 / -1;
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>🛒 家族の買い物リスト</h1>

        <div class="input-area">
            <input
                type="text"
                id="itemInput"
                placeholder="買うもの"
                maxlength="50"
                autocomplete="off"
            >

            <select
                id="userInput"
                aria-label="登録者"
            >
                <option value="一樹">一樹</option>
                <option value="和佳">和佳</option>
                <option value="陽多希">陽多希</option>
                <option value="旺佑">旺佑</option>
            </select>

            <button
                type="button"
                class="add-btn"
                id="addButton"
            >
                追加
            </button>
        </div>

        <ul id="shoppingList"></ul>

        <p
            id="emptyMessage"
            class="empty-message"
        >
            買うものはまだ登録されていません
        </p>
    </main>
