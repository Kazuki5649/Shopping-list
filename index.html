<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>家族の買い物リスト</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            margin: 10px 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .input-area {
            display: grid;
            grid-template-columns: 1fr 140px auto;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="text"],
        select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #ffffff;
            color: #333333;
            font-size: 16px;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #007aff;
            outline: 2px solid rgba(0, 122, 255, 0.2);
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-btn {
            padding: 12px 18px;
            background-color: #007aff;
            color: #ffffff;
            font-weight: bold;
        }

        .add-btn:active {
            background-color: #005fc4;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 14px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .check-box {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
