<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>家族の買い物リスト</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333333;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        h1 {
            margin: 10px 0 24px;
            text-align: center;
            font-size: 28px;
        }

        .input-area {
            display: grid;
            grid-template-columns: 1fr 110px 120px auto;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="text"],
        select {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            background-color: #ffffff;
            color: #333333;
            font-size: 16px;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #007aff;
            outline: 2px solid rgba(0, 122, 255, 0.2);
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .add-btn {
            padding: 12px 18px;
            background-color: #007aff;
            color: #ffffff;
            font-weight: bold;
        }

        .add-btn:active {
            background-color: #005fc4;
        }

        ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 14px;
            border-radius: 10px;
            background-color: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .check-box {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        .item-information {
            min-width: 0;
            flex: 1;
        }

        .item-name-line {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }

        .item-name {
            overflow-wrap: anywhere;
            font-size: 17px;
            font-weight: 600;
        }

        .item-quantity {
            padding: 3px 8px;
            border-radius: 12px;
            background-color: #eaf3ff;
            color: #0066cc;
            font-size: 14px;
            font-weight: 600;
        }

        .item-details {
            margin-top: 5px;
            color: #777777;
            font-size: 13px;
            line-height: 1.5;
        }

        .completed .item-name {
            color: #999999;
            text-decoration: line-through;
        }

        .completed .item-quantity {
            background-color: #eeeeee;
            color: #999999;
        }

        .completed .item-details {
            color: #aaaaaa;
        }

        .delete-btn {
            flex-shrink: 0;
            padding: 9px 12px;
            background-color: #ff3b30;
            color: #ffffff;
            font-size: 14px;
        }

        .delete-btn:active {
            background-color: #d93027;
        }

        .empty-message {
            margin-top: 30px;
            color: #777777;
            text-align: center;
        }

        @media (max-width: 600px) {
            body {
                padding: 14px;
            }

            h1 {
                font-size: 24px;
            }

            .input-area {
                grid-template-columns: 1fr 100px;
            }

            #userInput {
                grid-column: 1 / 2;
            }

            .add-btn {
                grid-column: 2 / 3;
                width: 100%;
            }
        }

        @media (max-width: 380px) {
            h1 {
                font-size: 21px;
            }

            .input-area {
                grid-template-columns: 1fr;
            }

            #userInput,
            .add-btn {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>🛒 家族の買い物リスト</h1>

        <div class="input-area">
            <input
                type="text"
                id="itemInput"
                placeholder="買うもの"
                maxlength="50"
                autocomplete="off"
            >

            <input
                type="text"
                id="quantityInput"
                placeholder="必要数"
                maxlength="15"
                autocomplete="off"
            >

            <select
                id="userInput"
                aria-label="登録者"
            >
                <option value="一樹">一樹</option>
                <option value="和佳">和佳</option>
                <option value="陽多希">陽多希</option>
                <option value="旺佑">旺佑</option>
            </select>

            <button
                type="button"
                class="add-btn"
                id="addButton"
            >
                追加
            </button>
        </div>

        <ul id="shoppingList"></ul>

        <p
            id="emptyMessage"
            class="empty-message"
        >
            買うものはまだ登録されていません
        </p>
    </main>

    <script>
        const storageKey = "shoppingList";

        let items = loadItems();

        function loadItems() {
            try {
                const savedItems =
                    localStorage.getItem(storageKey);

                return savedItems
                    ? JSON.parse(savedItems)
                    : [];
            } catch (error) {
                return [];
            }
        }

        function saveItems() {
            localStorage.setItem(
                storageKey,
                JSON.stringify(items)
            );
        }

        function getToday() {
            const today = new Date();

            const year = today.getFullYear();

            const month = String(
                today.getMonth() + 1
            ).padStart(2, "0");

            const day = String(
                today.getDate()
            ).padStart(2, "0");

            return year + "/" + month + "/" + day;
        }

        function renderList() {
            const list =
                document.getElementById("shoppingList");

            const emptyMessage =
                document.getElementById("emptyMessage");

            list.innerHTML = "";

            emptyMessage.style.display =
                items.length === 0
                    ? "block"
                    : "none";

            items.forEach(function (item, index) {
                const listItem =
                    document.createElement("li");

                if (item.checked) {
                    listItem.classList.add("completed");
                }

                const checkBox =
                    document.createElement("input");

                checkBox.type = "checkbox";
                checkBox.className = "check-box";
                checkBox.checked = Boolean(item.checked);

                checkBox.addEventListener(
                    "change",
                    function () {
                        toggleItem(index);
                    }
                );

                const itemInformation =
                    document.createElement("div");

                itemInformation.className =
                    "item-information";

                const itemNameLine =
                    document.createElement("div");

                itemNameLine.className =
                    "item-name-line";

                const itemName =
                    document.createElement("div");

                itemName.className = "item-name";
                itemName.textContent = item.name;

                itemNameLine.appendChild(itemName);

                if (item.quantity) {
                    const itemQuantity =
                        document.createElement("span");

                    itemQuantity.className =
                        "item-quantity";

                    itemQuantity.textContent =
                        "必要数：" + item.quantity;

                    itemNameLine.appendChild(itemQuantity);
                }

                const itemDetails =
                    document.createElement("div");

                itemDetails.className = "item-details";

                const userName =
                    item.user || "未入力";

                const inputDate =
                    item.createdDate || "記録なし";

                itemDetails.textContent =
                    "登録者：" + userName +
                    "　入力日：" + inputDate;

                const deleteButton =
                    document.createElement("button");

                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "削除";

                deleteButton.addEventListener(
                    "click",
                    function () {
                        deleteItem(index);
                    }
                );

                itemInformation.appendChild(itemNameLine);
                itemInformation.appendChild(itemDetails);

                listItem.appendChild(checkBox);
                listItem.appendChild(itemInformation);
                listItem.appendChild(deleteButton);

                list.appendChild(listItem);
            });
        }

        function addItem() {
            const itemInput =
                document.getElementById("itemInput");

            const quantityInput =
                document.getElementById("quantityInput");

            const userInput =
                document.getElementById("userInput");

            const name =
                itemInput.value.trim();

            const quantity =
                quantityInput.value.trim();

            const user =
                userInput.value;

            if (name === "") {
                alert("買うものを入力してください");
                itemInput.focus();
                return;
            }

            items.push({
                name: name,
                quantity: quantity,
                user: user,
                createdDate: getToday(),
                checked: false
            });

            saveItems();
            renderList();

            itemInput.value = "";
            quantityInput.value = "";

            itemInput.focus();
        }

        function toggleItem(index) {
            items[index].checked =
                !items[index].checked;

            saveItems();
            renderList();
        }

        function deleteItem(index) {
            const itemName =
                items[index].name;

            const shouldDelete =
                confirm(
                    "「" + itemName +
                    "」を削除しますか？"
                );

            if (!shouldDelete) {
                return;
            }

            items.splice(index, 1);

            saveItems();
            renderList();
        }

        document
            .getElementById("addButton")
            .addEventListener("click", addItem);

        document
            .getElementById("itemInput")
            .addEventListener(
                "keydown",
                function (event) {
                    if (event.key === "Enter") {
                        addItem();
                    }
                }
            );

        document
            .getElementById("quantityInput")
            .addEventListener(
                "keydown",
                function (event) {
                    if (event.key === "Enter") {
                        addItem();
                    }
                }
            );

        renderList();
    </script>
</body>
</html>
